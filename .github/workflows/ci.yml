name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Go, frontend and package checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SQLite CLI
        run: sudo apt-get update && sudo apt-get install -y sqlite3
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Go tests
        run: go test ./...
      - name: Go vet
        run: go vet ./...
      - name: Build controller
        run: go build -trimpath -ldflags "-X main.version=$(cat VERSION)" ./cmd/server
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend dependencies
        working-directory: web
        run: npm install --no-audit --no-fund
      - name: Build frontend
        working-directory: web
        run: npm run build
      - name: Validate release data skeleton
        run: |
          test -f data/.gitkeep
          test -f data/backups/.gitkeep
          test -f data/backups/bundles/.gitkeep
          test -f data/backups/containers/.gitkeep
          test -f data/logs/.gitkeep
          test -f data/host-tls/.gitkeep
      - name: Docker image build smoke test
        run: docker build --build-arg VIBEWATCH_VERSION="$(cat VERSION)" -t vibewatch-ci:${{ github.sha }} .

  docker-integration:
    name: Docker integration tests
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - name: Install SQLite CLI
        run: sudo apt-get update && sudo apt-get install -y sqlite3
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Docker integration smoke tests
        run: ./scripts/test-integration.sh
      - name: Install NetEm prerequisites
        run: sudo apt-get update && sudo apt-get install -y iproute2
      - name: NetEm ~50 ms RTT regression
        run: sudo env VIBEWATCH_NETEM_LOSS=0% ./scripts/test-netem.sh
