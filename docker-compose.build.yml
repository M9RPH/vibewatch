# Optional source-build overlay for developers. The default docker-compose.yml
# intentionally consumes the published GHCR image so normal installations do
# not require a local toolchain.
services:
  vibewatch-runtime-migrate:
    image: "vibewatch:0.9.5"
    build:
      context: .
      args:
        VIBEWATCH_VERSION: "0.9.5"

  vibewatch:
    image: "vibewatch:0.9.5"
    build:
      context: .
      args:
        VIBEWATCH_VERSION: "0.9.5"
    environment:
      VIBEWATCH_APP_IMAGE: "vibewatch:0.9.5"
