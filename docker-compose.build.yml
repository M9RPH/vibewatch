# Optional source-build overlay for developers. The default docker-compose.yml
# intentionally consumes the published GHCR image so normal installations do
# not require a local toolchain.
services:
  vibewatch-runtime-migrate:
    image: "vibewatch:1.0.0"
    build:
      context: .
      args:
        VIBEWATCH_VERSION: "1.0.0"

  vibewatch:
    image: "vibewatch:1.0.0"
    build:
      context: .
      args:
        VIBEWATCH_VERSION: "1.0.0"
    environment:
      VIBEWATCH_APP_IMAGE: "vibewatch:1.0.0"
      # Source-build only: enables the Owner-only ZIP development updater.
      # The regular release compose file does not expose the source tree.
      VIBEWATCH_DEVELOPER_UPDATES: "${VIBEWATCH_DEVELOPER_UPDATES:-true}"
      VIBEWATCH_PROJECT_DIR: "/workspace"
    volumes:
      - "${VIBEWATCH_PROJECT_SOURCE:-.}:/workspace"
